[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pykwork"
version = "2.0.0"
description = "Unofficial async Python library for Kwork API"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "your.email@example.com" }]
keywords = ["kwork", "api", "async", "httpx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["httpx>=0.24.0", "python-dotenv>=1.0.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/quonaro/pykwork"
Repository = "https://github.com/quonaro/pykwork"
Issues = "https://github.com/quonaro/pykwork/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pykwork*"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "W", "I"]
lint.ignore = ["E501"]
